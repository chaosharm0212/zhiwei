name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        env:
          # 绑了自定义域名后改成你的域名；用 xxx.github.io/repo 时改成 https://<user>.github.io
          SITE: https://chaosharm0212.dev
          # 项目页（xxx.github.io/repo）才需要下面这行，自定义域名时删掉
          # BASE_PATH: /repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
